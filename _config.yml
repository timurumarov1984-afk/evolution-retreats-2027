# Настройки сборки. Обычно их не трогают.
# Всё общее содержание — в _data/site.yml, встречи — в папке _events (одна встреча = один файл).
title: "Эволюция · Ретриты с Мастером"
url: "https://evolution.retreatmaster.online"   # адрес сайта без слеша в конце — нужен для превью ссылок. Тот же адрес записан в файле CNAME
baseurl: ""                                     # сайт лежит в корне своего домена, поэтому пусто. Без домена, на github.io, здесь было бы "/evolution-retreats-2027"
lang: ru
timezone: Europe/Moscow

collections:
  events:
    output: true
    permalink: /:name/

defaults:
  - scope: { path: "", type: events }
    values: { layout: event }

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - README.md
  - "Предложение — сайт Эволюции 2027 и воронка.md"
  - apps-script
  - "assets/media/СОСТАВ.md"
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
