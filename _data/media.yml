# Коллажи «Как это было» на страницах встреч. Файлы собирает tools/build-media.sh в assets/media/<папка>/.
# В файле встречи: collage: yasno-pole-2026 — и на странице встречи появится этот коллаж.
#
# Каждая плитка:
#   video: имя     — короткое видео без звука (имя.mp4 + первый кадр имя.webp), играет само, когда видно на экране
#   photo: имя     — фото (имя.webp)
#   size:  tall    — высокая плитка (две строки) · hero — главная плитка (на телефоне во всю ширину, на компьютере 2×2)
#   pos:   "50% 50%" — какая точка остаётся в кадре при обрезке
#   label: подпись поверх плитки (необязательно)
# Порядок плиток: высокая, главная, высокая, потом четыре обычных — так сетка заполняется без дыр.

yasno-pole-2026:
  folder: yasno-pole-2026
  title: "Как это было"
  caption: "Ясно Поле, интенсив с Мастером · сентябрь 2026"
  items:
    - { video: grass, size: tall, alt: "Золотая трава на закате" }
    - { video: hall, size: hero, alt: "Встреча с Мастером в зале Ясного Поля", label: "Встреча с Мастером", pos: "35% 50%" }
    - { video: pond, size: tall, alt: "Солнце над прудом" }
    - { photo: hay, alt: "Тюк сена с табличкой «С нами всё ясно»" }
    - { photo: pier, alt: "Мостки на пруду" }
    - { photo: pumpkins, alt: "Тыквы на поле" }
    - { photo: pine, alt: "Сосна и домик у пруда" }

