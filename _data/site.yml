# Частые вопросы. Обычный вопрос — это «q» (вопрос) и «a» (ответ): он одинаковый на всех страницах.
# Если для ретрита и интенсива ответы разные, у вопроса есть части «retreat» и «intensive»:
#   на странице ретрита показывается ответ для ретрита, на странице интенсива — для интенсива,
#   на главной — оба ответа под общим вопросом «q», с подписями из faq_labels.
faq_labels:
  retreat: "Ретриты в Чиралы"
  intensive: "Интенсивы"
faq:
  - q: "Я никогда не был на встречах с Мастером. Мне подойдёт?"
    retreat:
      a: "Да, участие возможно и без предыдущего опыта встреч с Мастером. Девятидневный ретрит включает утренние и вечерние беседы и медитации, а между встречами остаётся время для самостоятельного проживания опыта. При этом ретриты в Чиралы в основном ориентированы на выпускников «Эволюции», поэтому формат участия для новых участников лучше предварительно обсудить с организаторами."
    intensive:
      q: "Я никогда не был на встречах с Мастером. Мне подойдёт интенсив?"
      a: "Да. Интенсив открыт и для тех, кто впервые знакомится с практикой Мастера, и для тех, кто уже имеет опыт. Новые участники смогут познакомиться с подходом непосредственно в практике, а практикующие — углубить свой опыт."
  - q: "Можно ли работать во время ретрита или интенсива?"
    retreat:
      q: "Можно ли работать во время ретрита?"
      a: "Да. Встречи с Мастером проходят утром и вечером, остальная часть дня остаётся открытой: можно принимать участие в рабочих встречах и заниматься своими делами."
    intensive:
      q: "Можно ли работать во время интенсива?"
      a: "Интенсив предполагает полное погружение в практику. Занятия проходят в течение всего дня, поэтому совмещать участие с рабочими встречами и другими делами не предусмотрено. Рекомендуем заранее освободить эти три дня для практики."
  - q: "Можно ли участвовать онлайн?"
    retreat:
      a: "Да. Вы можете участвовать онлайн в утренних и вечерних встречах с Мастером. Для трансляции организованы качественное изображение и звук; подробности подключения мы направим участникам заранее."
    intensive:
      a: "Нет. Интенсив проходит только очно. В этом формате важно личное присутствие и непрерывное участие в общей практике. Мы не проводим онлайн-трансляций и не делаем записей интенсива."
  - q: "Что входит в стоимость?"
    a: "Встречи с Мастером. Проживание и питание оплачиваются отдельно, по специальным условиям для нашей группы."
  - q: "Как оплатить?"
    a: "После заявки мы свяжемся с вами, уточним детали и направим информацию по способам оплаты."
  - q: "Можно приехать вдвоём?"
    a: "Конечно. Будем рады вам и вашим +1 — отметьте это в заявке."

