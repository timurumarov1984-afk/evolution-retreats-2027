# Ретрит или интенсив — короткое сравнение
formats:
  title: "Ретрит или интенсив?"
  lead: "Два формата встреч с Мастером. Можно выбрать один или пройти оба за год."
  items:
    - name: "Ретрит"
      where: "Чиралы, Турция · весна и осень"
      facts:
        - "9 дней"
        - "Каждый день две встречи с Мастером: утром и вечером"
        - "Остальная часть дня открыта: можно работать, отдыхать, быть в тишине"
        - "Можно участвовать онлайн"
        - "В основном для тех, кто прошёл программу «Эволюция»"
      for: "Для глубокого погружения, не выключаясь из жизни. Выпускники Эволюции приезжают в Чиралы дважды в год — весной и осенью."
    - name: "Интенсив"
      where: "Стамбул (январь и август) и Ясно Поле (сентябрь)"
      facts:
        - "3 дня, выходные"
        - "Пятница и суббота с 10:00 до 18:00, воскресенье с 10:00 до 15:00"
        - "Практика весь день, вдали от суеты"
        - "Ближе к дому и короче по времени"
        - "Открыт для всех — проходить «Эволюцию» не нужно"
      for: "Первый опыт знакомства с подходом Мастера или интенсивная внутренняя работа для практикующих."

