        - "Глубокое погружение в практику в течение всего дня"
        - "Только очное участие, без онлайн-трансляций и записей"
        - "Для всех учеников Мастера и новых участников"
      for: "Первый опыт знакомства с подходом Мастера или интенсивная внутренняя работа для практикующих."

